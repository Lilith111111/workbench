<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#B8A1F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<title>工作台</title>
<style>
  :root{
    --bg:#F6F2FC;
    --card:#FFFFFF;
    --text:#2D2D3A;
    --muted:#9A94A8;
    --line:#EDE8F6;
    --primary:#B08DF7;
    --primary-dark:#9B72EF;
    --primary-light:#EDE6FF;
    --green:#86EFAC;
    --green-dark:#4ADE80;
    --yellow:#FFF59D;
    --yellow-dark:#FCD34D;
    --red:#FDA4AF;
    --shadow:0 8px 28px rgba(140,120,190,0.13);
    --shadow-soft:0 4px 14px rgba(140,120,190,0.10);
    --radius:26px;
    --radius-sm:20px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"Nunito","Varela Round","Quicksand","M PLUS Rounded 1c","ui-rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:relative;height:100vh;height:100dvh;padding-top:var(--safe-t);padding-bottom:calc(64px + var(--safe-b));overflow:hidden;}

  .content{position:relative;height:100%;overflow:hidden;}
  .view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .28s ease,transform .28s ease;}
  .view.active{opacity:1;transform:none;pointer-events:auto;}
  .view-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:transparent transparent;}
  .view-body::-webkit-scrollbar{width:6px;}
  .view-body::-webkit-scrollbar-track{background:transparent;}
  .view-body::-webkit-scrollbar-thumb{background:transparent;border-radius:6px;transition:background .25s;}
  .view-body.scrolling{scrollbar-color:rgba(130,130,150,0.45) transparent;}
  .view-body.scrolling::-webkit-scrollbar-thumb{background:rgba(130,130,150,0.45);}
  .view-head{padding:18px 20px 10px;}
  .view-head h1{margin:0;font-size:26px;font-weight:900;}

  .btn{border:none;border-radius:var(--radius-sm);font-weight:800;font-size:15px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,filter .12s;font-family:inherit;}
  .btn:active{transform:scale(.95);}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:var(--shadow-soft);padding:12px 20px;}
  .btn-block{width:100%;padding:14px;}
  .btn-soft{background:#F3EEFC;color:var(--primary-dark);padding:11px 16px;}
  .dm-row{display:flex;gap:12px;}
  .dm-row .btn{flex:1;}
  .btn-fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);position:fixed;right:18px;bottom:calc(82px + var(--safe-b));z-index:40;transition:transform .15s,opacity .2s;border:none;outline:none;}
  .btn-fab:active{transform:scale(.9);}
  .btn-fab.hidden{opacity:0;pointer-events:none;}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-soft);}
  .muted{color:var(--muted);}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}

  /* bottom nav */
  .nav-bottom{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));background:#fff;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;box-shadow:0 -4px 20px rgba(140,120,180,0.10);z-index:50;}
  .nav-item{background:transparent;border:none;cursor:pointer;color:#B8B3C5;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;border-radius:14px;transition:transform .12s,color .2s;}
  .nav-item svg{width:26px;height:26px;}
  .nav-item span{font-size:11px;font-weight:800;}
  .nav-item:active{transform:scale(.88);}
  .nav-item.active{color:var(--primary-dark);}

  /* modals */
  .modal{position:fixed;inset:0;background:rgba(45,45,58,0.45);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding-top:var(--modal-top,0px);padding-bottom:var(--modal-kb,0px);}
  .modal.open{opacity:1;pointer-events:auto;}
  .modal-card{background:#fff;width:100%;max-height:min(92dvh, var(--modal-max-h, 92dvh));border-radius:26px 26px 0 0;padding:20px 20px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .28s cubic-bezier(.25,.8,.25,1);overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .modal.open .modal-card{transform:none;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:sticky;top:0;background:#fff;z-index:5;padding-bottom:2px;}
  .modal-head h2{margin:0;font-size:20px;font-weight:900;}
  .modal-close{width:34px;height:34px;border-radius:50%;border:none;background:var(--line);color:var(--text);font-size:18px;cursor:pointer;}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:7px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;font-size:15px;font-family:inherit;background:#fff;outline:none;transition:border-color .15s;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);}
  .form-group textarea{min-height:76px;resize:none;}
  .form-row{display:flex;gap:12px;}
  .form-row .form-group{flex:1;}
  .form-actions{display:flex;gap:12px;margin-top:8px;position:sticky;bottom:0;background:#fff;z-index:5;padding-top:10px;}
  .form-actions .btn{flex:1;}
  .form-actions .btn-danger{background:#FEE2E2;color:#DC2626;}
  .checkbox-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;}
  .checkbox-wrap input{width:20px;height:20px;accent-color:var(--primary-dark);}
  .color-pick{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px;}
  .time-clearable{position:relative;}
  .time-input-wrap{position:relative;display:flex;align-items:center;}
  .time-input-wrap input[type=time]{width:100%;padding-right:30px;}
  .time-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;border-radius:50%;background:#ECE6FA;color:#9B72EF;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .time-clear:active{transform:translateY(-50%) scale(0.9);}
  .color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,0.12);transition:transform .1s,border-color .1s;}
  .color-dot.sel{border-color:var(--text);transform:scale(1.12);}
  .seg{display:flex;gap:0;background:#F1ECFB;border-radius:14px;padding:4px;}
  .seg-btn{flex:1;border:none;background:transparent;padding:11px 0;border-radius:10px;font-size:15px;font-weight:800;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .15s;}
  .seg-btn.active{background:#fff;color:var(--primary-dark);box-shadow:0 2px 6px rgba(120,80,180,0.15);}

  /* confetti */
  .confetti{position:fixed;pointer-events:none;z-index:200;}

  /* ---------- Countdown view ---------- */
  .cd-list{padding:10px 18px 22px;display:flex;flex-direction:column;gap:14px;}
  .cd-card{background:var(--cc-base,#fff);border:2.5px solid var(--cc-ring,#E5DEF7);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow-soft);position:relative;text-align:center;}
  .cd-top{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:10px;}
  .cd-name{font-size:16px;font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-status{font-size:14px;font-weight:700;color:var(--muted);flex-shrink:0;}
  .cd-days{font-size:52px;font-weight:900;color:var(--text);line-height:1;margin:6px 0 16px;}
  .cd-days .unit{font-size:52px;font-weight:900;color:var(--text);margin-left:1px;}
  .cd-divider{height:0;border-top:1px dashed var(--line);margin:0 auto 12px;max-width:70%;}
  .cd-date{font-size:13px;color:var(--text);font-weight:700;}
  .cd-note{font-size:13px;color:var(--muted);margin-top:10px;font-weight:700;}

  /* ---------- Checkin view ---------- */
  .ci-list{padding:10px 18px 22px;}
  .ci-card{background:var(--cc-base,#fff);border:2.5px solid var(--cc-ring,#E5DEF7);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .ci-body{display:flex;align-items:center;gap:10px;min-width:0;}
  .ci-text{flex:1;min-width:0;}
  .ci-meta-inline{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .ci-meta-inline .ci-meta-l1{color:var(--muted);font-size:12px;font-weight:800;}
  .ci-meta-inline .ci-meta-l2{color:var(--muted);font-size:12px;font-weight:800;}
  .ci-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
  .ci-name{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
  .ci-right-text{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;}
  .ci-line{font-size:12px;color:var(--muted);font-weight:800;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ci-check{width:42px;height:42px;border-radius:50%;border:2px solid var(--cc-ring,rgba(45,45,58,0.2));background:rgba(255,255,255,0.75);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0;cursor:pointer;transition:transform .12s,background .15s,color .15s;}
  .ci-check:active{transform:scale(.86);}
  .ci-check.done{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);}
  .ci-check.disabled{opacity:.45;cursor:not-allowed;background:rgba(225,225,232,0.7);border-color:rgba(185,185,195,.5);color:var(--muted);}

  /* ---------- Calendar view ---------- */
  .cal-header{background:linear-gradient(180deg,#CDB4FF 0%,#E9E0FC 100%);border-radius:0 0 32px 32px;padding:16px 18px 14px;transition:all .3s ease;position:relative;z-index:5;}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-title{font-size:26px;font-weight:900;margin:0;}
  .cal-actions{display:flex;align-items:center;gap:10px;}
  .cal-today-btn{font-size:13px;font-weight:800;color:var(--primary-dark);background:rgba(255,255,255,0.75);border:none;border-radius:14px;padding:7px 12px;cursor:pointer;}
  .cal-expand{width:34px;height:34px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:22px;line-height:1;cursor:pointer;transition:transform .2s;}
  .cal-expand.open{transform:rotate(180deg);}
  .cal-expand-wrap{display:flex;justify-content:center;align-items:center;margin-top:4px;}
  .cal-nav-arrow{position:absolute;top:54%;transform:translateY(-50%);width:32px;height:32px;border:none;background:rgba(255,255,255,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary-dark);font-size:24px;font-weight:900;line-height:1;cursor:pointer;z-index:6;transition:background .15s;opacity:0;pointer-events:none;}
  .cal-nav-arrow:active{background:rgba(255,255,255,0.7);}
  .cal-header.expanded .cal-nav-arrow{opacity:1;pointer-events:auto;}
  .cal-nav-arrow.prev{left:6px;}
  .cal-nav-arrow.next{right:6px;}
  .cal-week{display:flex;justify-content:space-between;align-items:flex-start;}
  .cal-header.expanded .cal-week{display:none;}
  .cal-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border-radius:18px;cursor:pointer;transition:background .15s;}
  .cal-day .dow{font-size:12px;color:var(--muted);font-weight:800;}
  .cal-day .date{font-size:16px;font-weight:900;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:all .15s;}
  .cal-day.active{background:#fff;box-shadow:0 2px 8px rgba(140,120,190,0.12);}
  .cal-day.active .date{background:var(--primary-dark);color:#fff;}
  .cal-day.active .dow{color:var(--primary-dark);}
  .cal-day.today:not(.active) .date{color:var(--primary-dark);}
  .cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 4px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.35);}
  .cal-header:not(.expanded) .cal-month{display:none;}
  .cal-month .m-dow{text-align:center;font-size:12px;color:var(--muted);font-weight:800;padding:4px 0;}
  .cal-month .m-day{text-align:center;font-size:14px;font-weight:800;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;}
  .cal-month .m-day.other{color:#CBC5D8;}
  .cal-month .m-day.today{background:rgba(176,141,247,0.12);color:var(--primary-dark);}
  .cal-month .m-day.active{background:var(--primary-dark);color:#fff;}
  .cal-month .m-day{position:relative;}
  .cal-month .m-day.has-cd::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#FCD34D;bottom:2px;left:50%;transform:translateX(-50%);}
  .cal-day .cd-label{font-size:9px;font-weight:800;color:#FCD34D;margin-top:1px;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}

  .cal-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 22px;background:#fff;border-radius:32px 32px 0 0;margin-top:-18px;position:relative;z-index:6;}
  .timeline{position:relative;}
  .tl-item{display:flex;gap:10px;margin-bottom:18px;align-items:stretch;}
  .tl-axis{position:relative;width:88px;flex-shrink:0;}
  .tl-rail{position:absolute;left:66px;top:0;bottom:0;width:2px;background:var(--line);border-radius:2px;}
  .tl-axis.bridge .tl-rail{bottom:-18px;}
  .tl-dot{position:absolute;left:66px;width:11px;height:11px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(155,114,239,.18);transform:translate(-50%,-50%);}
  .tl-dot.top{top:10px;}
  .tl-dot.mid{top:50%;}
  .tl-dot.bottom{bottom:10px;top:auto;transform:translate(-50%,50%);}
  .tl-rail.light{background:#E6DFF4;}
  .tl-dot.light{background:#fff;border:2px solid #CFC6E4;box-shadow:none;}
  .tl-t{position:absolute;left:0;width:58px;text-align:right;font-size:11px;font-weight:800;white-space:nowrap;line-height:1;}
  .tl-t.done{color:var(--primary);}
  .tl-t.plan{color:#C9C2D8;}
  .tl-t.top{top:6px;}
  .tl-t.mid{top:50%;transform:translateY(-50%);}
  .tl-t.bottom{bottom:6px;}
  .tl-mood{font-size:14px;font-weight:800;color:var(--primary-dark);margin-top:5px;display:flex;align-items:center;gap:4px;line-height:1.2;}
  .tl-note{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .tl-card{flex:1;border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:12px 14px;position:relative;background:var(--cc-base,#fff);border:2px solid var(--cc-ring,#E5DEF7);display:flex;flex-direction:column;gap:8px;}
  .tl-card.done{opacity:.72;}
  .tl-meta-inline{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .tl-meta-inline span{font-size:11px;font-weight:800;}
  .tl-meta-inline .tl-meta-l1{color:var(--muted);}
  .tl-meta-inline .tl-meta-l2{color:var(--muted);}
  .tl-body{display:flex;align-items:center;gap:10px;min-width:0;}
  .tl-name{font-size:16px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-action-slot{flex-shrink:0;display:flex;align-items:center;}
  .tl-head{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .tl-emoji{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.06);}
  .tl-text{flex:1;min-width:0;}
  .tl-title{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-mood-inline{margin-left:6px;font-weight:800;color:var(--primary-dark);font-size:14px;white-space:nowrap;}
  .tl-mood-emoji{font-size:18px;font-weight:400;margin-right:2px;vertical-align:-1px;}
  .tl-sub{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .tl-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--cc-ring,rgba(45,45,58,0.18));background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
  .tl-check.checked{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .tl-check.checked::after{content:"✓";font-size:15px;font-weight:900;}
  .tl-check.disabled{opacity:.45;cursor:not-allowed;background:#EEEFF3;border-color:rgba(185,185,195,.45);}
  .tl-btn{border:none;border-radius:14px;padding:8px 16px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .15s;}
  .tl-btn.start{background:#fff;color:var(--primary-dark);border:2px solid var(--primary);}
  .tl-btn.pause{background:#fff;color:#d97706;border:2px solid #d97706;}
  .tl-btn.resume{background:#fff;color:var(--primary-dark);border:2px solid var(--primary);}
  .tl-btn.end{background:var(--primary-dark);color:#fff;}
  .tl-action-slot{display:flex;gap:6px;justify-content:flex-end;align-items:center;}
  .tl-divider{text-align:center;font-size:13px;color:var(--muted);font-weight:800;margin:22px 0 16px;position:relative;}
  .tl-summary{margin:4px 0 16px;padding:10px 14px;background:var(--primary-light);border:1px dashed var(--primary);border-radius:14px;font-size:13px;font-weight:800;color:var(--primary-dark);display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;}
  .tl-summary b{font-size:15px;color:var(--primary-dark);}
  .tl-divider::before,.tl-divider::after{content:"";position:absolute;top:50%;height:1px;background:var(--line);width:30%;}
  .tl-divider::before{left:0;}
  .tl-divider::after{right:0;}

  .task-card-yellow{background:var(--cc-base,#FFF59D);border:2.5px solid var(--cc-ring,#FCD34D);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-soft);margin-bottom:14px;touch-action:none;user-select:none;}
  .task-card-yellow.sort-ghost{opacity:.5;}
  .task-card-yellow .tc-left{flex:1;min-width:0;}
  .task-card-yellow .tc-tag{font-size:12px;color:var(--text);opacity:.65;font-weight:800;}
  .task-card-yellow .tc-name{font-size:17px;font-weight:900;margin-top:1px;}
  .task-card-yellow .tc-sub{font-size:12px;color:var(--text);opacity:.55;font-weight:700;margin-top:2px;}
  .task-card-yellow .tc-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--cc-ring,rgba(45,45,58,0.2));background:rgba(255,255,255,0.75);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
  .task-card-yellow .tc-check.checked{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .task-card-yellow .tc-check.checked::after{content:"✓";font-size:14px;font-weight:900;}

  /* ---------- Stats view ---------- */
  .st-list{padding:10px 18px 22px;}
  .st-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-soft);margin-bottom:14px;}
  .st-title{font-size:17px;font-weight:700;margin-bottom:2px;}
  .st-sub{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:14px;}
  .st-row{display:flex;gap:12px;flex-wrap:wrap;}
  .st-item{flex:1;min-width:100px;background:var(--primary-light);border-radius:18px;padding:14px;text-align:center;}
  .st-item .num{font-size:26px;font-weight:900;color:var(--primary-dark);}
  .st-item .label{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px;}

<script>
/* ============ Helpers ============ */
const pad=n=>String(n).padStart(2,"0");
const dateKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>dateKey(new Date());
const parseKey=k=>{try{const[y,m,d]=String(k).split("-").map(Number);if([y,m,d].some(isNaN))return new Date();return new Date(y,m-1,d);}catch(e){return new Date();}};
const taskOnDay=(t,k)=>(t.date<=k&&k<=(t.endDate||t.date));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const val=id=>{const e=document.getElementById(id);return e?e.value:""};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* card color palette: base = fill, ring = outer line/border (default yellow) */
const CARD_COLORS={
  yellow:{base:"#FFF59D",ring:"#FCE08A"},
  purple:{base:"#EDE6FF",ring:"#D9C9FB"},
  green:{base:"#DCFCE7",ring:"#BBF7D0"},
  blue:{base:"#E0F2FE",ring:"#BBE6FD"},
  pink:{base:"#FCE7F3",ring:"#FBD0E8"},
  red:{base:"#FEE2E2",ring:"#FEC9C9"}
};
const DEFAULT_CARD_COLOR="yellow";
let selColor="yellow";
function cardColorOf(key){return CARD_COLORS[key]||CARD_COLORS[DEFAULT_CARD_COLOR];}
function applyCardColor(el,key){const c=cardColorOf(key);el.style.setProperty("--cc-base",c.base);el.style.setProperty("--cc-ring",c.ring);}
function renderColorPicker(containerId,selected){
  const box=document.getElementById(containerId);if(!box)return;box.innerHTML="";
  Object.keys(CARD_COLORS).forEach(key=>{
    const c=CARD_COLORS[key];
    const d=document.createElement("div");d.className="color-dot"+(key===selected?" sel":"");d.style.background=c.base;d.title=key;
    d.addEventListener("click",()=>{selColor=key;box.querySelectorAll(".color-dot").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");});
    box.appendChild(d);
  });
}
function weekDayName(i){return ["日","一","二","三","四","五","六"][i];}
function formatHM(d){return pad(d.getHours())+":"+pad(d.getMinutes());}
function nowHM(){return formatHM(new Date());}
function isSameDay(d,k){return dateKey(d)===k;}
function diffDays(target){
  const a=new Date(target);a.setHours(0,0,0,0);
  const b=new Date();b.setHours(0,0,0,0);
  return Math.round((a-b)/86400000);
}
function weekRange(d=new Date()){
  const start=new Date(d);start.setDate(d.getDate()-d.getDay());start.setHours(0,0,0,0);
  const end=new Date(start);end.setDate(start.getDate()+7);end.setHours(0,0,0,0);
  return[start,end];
}
function monthRange(d=new Date()){
  const start=new Date(d.getFullYear(),d.getMonth(),1);start.setHours(0,0,0,0);
  const end=new Date(d.getFullYear(),d.getMonth()+1,1);end.setHours(0,0,0,0);
  return[start,end];
}
function formatDateDot(k){const d=parseKey(k);return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} 周${weekDayName(d.getDay())}`;}
const MOODS={"兴奋":"🤩","开心":"😊","平静":"😌","困倦":"😪","疲累":"😩","无语":"🙄","伤心":"😢","生气":"😠","毁灭":"💥"};

/* ============ Checkin date-mode helpers ============ */
function checkinOnDay(c,k){
  if(!c.repeat||c.repeat==="daily") return true;
  if(c.repeat==="once") return k===c.start;
  if(c.repeat==="range") return (c.start||"")<=k && k<=(c.end||k);
  return true;
}
function checkinDateText(c){
  if(c.repeat==="once"){
    const d=parseKey(c.start);
    return (c.start===dateKey(new Date()))?"当日打卡":`${d.getMonth()+1}月${d.getDate()}日打卡`;
  }
  if(c.repeat==="range"){
    const a=parseKey(c.start), b=parseKey(c.end);
    if(a.getMonth()===b.getMonth()) return `${a.getDate()}号到${b.getDate()}号`;
    return `${a.getMonth()+1}月${a.getDate()}号到${b.getMonth()+1}月${b.getDate()}号`;
  }
  return "每日打卡";
}
/* 时间窗口：开始/结束可只设其一；都不设 → 随时可打卡；支持跨午夜（如 21:00-02:00） */
function inTimeWindow(c){
  const s=c.wStart, e=c.wEnd;
  if(!s){ // 没设开始时间
    if(!e) return true;                  // 开始/结束都没设 → 随时可打卡
    return timeMin(nowHM())<=timeMin(e); // 只设结束 → 结束时间前可打卡
  }
  const now=nowHM();
  if(!e||e===s) return timeMin(now)>=timeMin(s); // 只设开始(或起止相同) → 开始后可打卡
  if(e>s) return timeMin(now)>=timeMin(s) && timeMin(now)<=timeMin(e); // 同日窗口
  return timeMin(now)>=timeMin(s) || timeMin(now)<=timeMin(e);         // 跨午夜窗口
}
function canPunch(c){ return checkinOnDay(c, dateKey(selDate)) && inTimeWindow(c); }
function checkinBlockedMsg(c){
  if(!checkinOnDay(c, dateKey(selDate))) return "该打卡不在设定的日期内，无法打卡";
  return "未到打卡时间（"+(c.wStart||"")+(c.wEnd?("-"+c.wEnd):"")+"），暂不能打卡";
}
/* 打卡卡片右下角的时间窗口提示：只设开始→几点之后；只设结束→几点之前；都设→起止 */
function windowHint(c){
  if(c.wStart && c.wEnd) return c.wStart+"–"+c.wEnd;
  if(c.wStart) return c.wStart+" 之后";
  if(c.wEnd) return c.wEnd+" 之前";
  return "";
}

/* ============ Storage v5 ============ */
const STORE_KEY="wb_data_v5";
let state=loadState();
let route="countdown";
let selDate=new Date();
let calExpanded=false;
let editingId=null, editingType=null;
let pendingCheckin=null;
let selectedMood=null;

function migrateState(s){
  /* 一次性迁移：把默认「起床/睡觉」的时间窗改成新默认（只跑一次，之后用户可自行改） */
  try{
    if(!localStorage.getItem("wb_mig_window_v1")){
      s.checkins.forEach(c=>{
        if(c.isDefault && c.name==="起床"){ c.wStart=""; c.wEnd="08:00"; }
        if(c.isDefault && c.name==="睡觉"){ c.wStart=""; c.wEnd="23:00"; }
      });
      localStorage.setItem("wb_mig_window_v1","1");
    }
  }catch(e){}
  s.countdowns=s.countdowns||[];
  s.checkins=s.checkins||[];
  s.tasks=s.tasks||[];
  const tk=todayKey();
  s.checkins.forEach((c,i)=>{
    if(!c.records||typeof c.records!=="object"||Array.isArray(c.records)){
      // old format stored records as an array (not date-keyed) -> best-effort: treat as today's completions
      c.records=Array.isArray(c.records)?{[tk]:c.records}:{};
    }
    if(typeof c.showInTimeline!=="boolean") c.showInTimeline=true;
    c.color=c.color||"yellow";
    c.isDefault=!!c.isDefault;
    if(typeof c.order!=="number") c.order=c.isDefault?i:100+i;
    if(typeof c.daily!=="number") c.daily=1;
    if(c.wStart===undefined) c.wStart="08:00"; if(c.wEnd===undefined) c.wEnd="";
    if(typeof c.repeat!=="string") c.repeat="daily";
    if(!c.start) c.start=tk;
    if(!c.end) c.end=dateKey(new Date(Date.now()+365*86400000));
    c.name=c.name||"打卡";
  });
  s.tasks.forEach((t,i)=>{
    if(t.type==="period"&&t.phase===undefined){t.phase=t.done>=1?"done":"pending";}
    t.type=t.type||"point";
    t.repeat=t.repeat||"once";
    t.date=t.date||tk;
    t.endDate=t.endDate||t.date;
    t.color=t.color||"yellow";
    if(typeof t.order!=="number") t.order=i;
    if(t.type==="period"&&!t.phase) t.phase="pending";
    if(t.runStart===undefined) t.runStart=null;
    if(t.workMs===undefined) t.workMs=0;
    if(t.lastWorkDate===undefined) t.lastWorkDate=null;
    if(t.phase==="started"){
      /* 重开页面后接续计时：先把已进行的工时并入 workMs，再把 runStart 重置为当前时刻继续计，避免重载丢进度 */
      if(t.runStart!=null) t.workMs=(t.workMs||0)+Math.max(0,Date.now()-t.runStart);
      t.runStart=Date.now();
      t.lastWorkDate=tk;
    }
    t.planStart=t.planStart||"";
    t.planEnd=t.planEnd||"";
    if(typeof t.done!=="number") t.done=0;
    t.name=t.name||"任务";
  });
  return s;
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    const s=raw?JSON.parse(raw):null;
    if(s&&typeof s==="object") return migrateState(s);
  }catch(e){}
  return initState();
}
function exportData(){
  try{
    const data=JSON.stringify(state,null,2);
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const ts=new Date().toISOString().slice(0,10);
    a.href=url; a.download="workbuddy-data-"+ts+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ alert("导出失败："+e.message); }
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed||typeof parsed!=="object") throw new Error("格式错误");
      state=migrateState(parsed);
      saveState();
      render();
      alert("数据已导入并恢复");
    }catch(e){ alert("导入失败：文件不是有效的备份"); }
  };
  reader.onerror=()=>alert("读取文件失败");
  reader.readAsText(file);
}
function initState(){

    card.addEventListener("click",()=>openCountdownModal(card.dataset.id));

}

/* ============ Checkin ============ */
function renderCheckins(){
  const el=document.getElementById("ci-list");
  const k=dateKey(selDate);
  const all=state.checkins.filter(c=>!c.isDefault);
  const list=all.filter(c=>checkinOnDay(c,k)).sort((a,b)=>a.order-b.order);
  if(!all.length){el.innerHTML='<div class="empty">还没有自定义打卡，点击右下角 + 添加</div>';return;}
  if(!list.length){el.innerHTML='<div class="empty">今天没有需要打卡的项目</div>';return;}
  el.innerHTML="";
  list.forEach(c=>{
    const today=k;
    const recs=c.records[today]||[];
    const done=recs.length;
    const isMulti=c.daily>1;
    const complete=!isMulti && done>=c.daily;
    const punchable=canPunch(c);
    const checkInner=isMulti?"+1":(complete?"✓":"");
    const wHint=windowHint(c);
    let leftTxt=checkinDateText(c);
    let metaL2="";
    if(!c.showInTimeline){ // 不在时间轴显示 → 右下角始终显示打卡时间（忽略窗口提示）
      if(isMulti) leftTxt+=" "+done+"/"+c.daily;
      metaL2=recs.length?("打卡 "+recs[recs.length-1].time):"尚未打卡";
    }else if(wHint){ // 设置了时间窗口 → 右下角显示窗口（之后/之前/起止）
      if(isMulti) leftTxt+=" "+done+"/"+c.daily;
      metaL2=wHint;
    }else{ // 未设置时间 → 右下角显示打卡时间（实际打卡时刻）
      if(isMulti) leftTxt+=" "+done+"/"+c.daily;
      metaL2=recs.length?("打卡 "+recs[recs.length-1].time):"尚未打卡";
    }
    const metaR=metaL2?`<span class="ci-meta-l2">${metaL2}</span>`:"";
    const card=document.createElement("div");card.className="ci-card";
    card.innerHTML=`<div class="ci-body">
        <div class="ci-text"><div class="ci-name">${esc(c.name)}</div></div>
        <div class="ci-check${complete?" done":""}${(!complete&&!punchable)?" disabled":""}" data-action="punch" data-id="${c.id}">${checkInner}</div>
      </div>
      <div class="ci-meta-inline"><span class="ci-meta-l1">${leftTxt}</span>${metaR}</div>`;
    applyCardColor(card,c.color);
    el.appendChild(card);
    card.addEventListener("click",()=>openCheckinModal(c.id));
    const chk=card.querySelector(".ci-check");
    if(!complete){
      chk.addEventListener("click",e=>{
        e.stopPropagation();
        if(!punchable){ alert(checkinBlockedMsg(c)); return; }
        confettiAtEl(chk);punchCheckin(c.id);
      });
    }
  });
}
function weekCount(c){
  const[a,b]=weekRange(new Date());
  let n=0;
  for(const k in c.records){
    const t=parseKey(k).getTime();
    if(t>=a.getTime()&&t<b.getTime())n+=c.records[k].length;
  }
  return n;
}
function punchCheckin(id){
  const c=state.checkins.find(x=>x.id===id);
  if(!c)return;
  if(!canPunch(c)){ alert(checkinBlockedMsg(c)); return; }
  const k=dateKey(selDate);
  c.records[k]=c.records[k]||[];
  const done=c.records[k].length;
  if(c.daily===1){
    if(done>=1)return; // 已完成的单次打卡不可取消
    c.records[k].push({time:nowHM(),mood:"",at:new Date().toISOString()});
  }else{
    c.records[k].push({time:nowHM(),mood:"",at:new Date().toISOString()}); // 多次：不限次数，一直可加一
  }
  saveState();
  render();
}

/* ============ Calendar ============ */
function renderCalendar(){
  const title=document.getElementById("cal-title");
  if(calExpanded){
    title.textContent=`${selDate.getFullYear()}年${selDate.getMonth()+1}月`;
  }else if(isSameDay(selDate,dateKey(new Date()))){
    title.textContent="今天";
  }else{
    title.textContent=`${selDate.getMonth()+1}月${selDate.getDate()}日`;
  }
  document.getElementById("btn-expand").classList.toggle("open",calExpanded);
  document.getElementById("cal-header").classList.toggle("expanded",calExpanded);

  // week strip
  const start=new Date(selDate);start.setDate(selDate.getDate()-selDate.getDay());
  const weekEl=document.getElementById("cal-week");weekEl.innerHTML="";
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const k=dateKey(d);const active=isSameDay(selDate,k);const today=isSameDay(new Date(),k);
    const cds=state.countdowns.filter(c=>c.target===k);
    const btn=document.createElement("div");btn.className="cal-day"+(active?" active":"")+(today?" today":"");
    btn.innerHTML=`<span class="dow">${weekDayName(i)}</span><span class="date">${d.getDate()}</span>`+(cds.length?`<span class="cd-label">${esc(cds[0].name)}</span>`:"");
    btn.addEventListener("click",()=>{selDate=new Date(d);calExpanded=false;renderCalendar();});
    weekEl.appendChild(btn);
  }

  // month grid inside same header
  const monthEl=document.getElementById("cal-month");monthEl.innerHTML="";
  if(calExpanded){
    monthEl.classList.add("open");
    for(let i=0;i<7;i++){
      const d=document.createElement("div");d.className="m-dow";d.textContent=weekDayName(i);monthEl.appendChild(d);
    }
    const y=selDate.getFullYear(),m=selDate.getMonth();
    const first=new Date(y,m,1);
    const startGrid=new Date(first);startGrid.setDate(1-first.getDay());
    for(let i=0;i<42;i++){
      const d=new Date(startGrid);d.setDate(startGrid.getDate()+i);
      const k=dateKey(d);
      const hasCd=state.countdowns.some(c=>c.target===k);
      const cell=document.createElement("div");
      cell.className="m-day"+(hasCd?" has-cd":"");
      if(d.getMonth()!==m)cell.classList.add("other");
      if(isSameDay(new Date(),k))cell.classList.add("today");
      if(isSameDay(selDate,k))cell.classList.add("active");
      cell.textContent=d.getDate();
      cell.addEventListener("click",()=>{selDate=new Date(d);renderCalendar();});
      monthEl.appendChild(cell);
    }
  }else monthEl.classList.remove("open");

  // body
  const body=document.getElementById("cal-body");body.innerHTML="";
  const k=dateKey(selDate);

  const items=[];

  // routine checkins: wake/sleep always first, then custom timeline checkins
  const timelineCheckins=state.checkins.filter(c=>c.showInTimeline && checkinOnDay(c,k)).sort((a,b)=>{
    if(a.isDefault&&!b.isDefault)return -1;
    if(!a.isDefault&&b.isDefault)return 1;
    return a.order-b.order;
  });
  timelineCheckins.forEach(c=>{
    const recs=c.records[k]||[];
    if(recs.length){
      recs.forEach((r,idx)=>{
        items.push({type:"routine",order:0,time:r.time,time2:"",title:c.name,color:c.color||"yellow",emoji:MOODS[r.mood]||"",moodText:r.mood||"",note:r.note||"",cls:"",id:c.id+"-"+idx,data:c,idx,kind:"checkin"});
      });
    }else{
      items.push({type:"routine-pending",order:1,time:c.wStart,time2:c.wEnd||"",title:c.name,color:c.color||"yellow",sub:"未打卡",emoji:c.name==="起床"?"🌅":(c.name==="睡觉"?"🌙":"✓"),cls:"",id:c.id,data:c,kind:"checkin"});
    }
  });

  // tasks
  const dayTasks=state.tasks.filter(t=>taskOnDay(t,k)).sort((a,b)=>a.order-b.order);
  dayTasks.forEach(t=>{
    const isPoint=(t.type==="point"||t.type==="single");
    const time=t.planStart||"";
    const time2=isPoint?"":(t.planEnd||"");
    const done=isTaskDone(t);
    if(done){
      items.push({type:"task-done",order:0,time,time2,title:t.name,color:t.color||"yellow",sub:t.desc||"已完成",emoji:"",cls:"",id:t.id,data:t});
    }else{
      items.push({type:"task-pending",order:2,time,time2,title:t.name,color:t.color||"yellow",sub:t.desc||(isPoint?(time):(time+"-"+time2)),emoji:"",cls:"",id:t.id,data:t});
    }
  });

  // 已完成：按实际完成时间排序（打卡=记录时间，任务=完成时间/结束时间）
  const doneTimeOf=it=>{
    if(it.kind==="checkin")return it.time||"23:59";
    const t=it.data;
    if(t.type==="period")return t.endedAt||hhmm(t.completedAt);
    return hhmm(t.completedAt);
  };
  const doneItems=items.filter(i=>i.order===0).sort((a,b)=>timeMin(doneTimeOf(a))-timeMin(doneTimeOf(b)));

  // 未完成：按设置的预计时间排序（起床/睡觉按 wStart，任务按 planStart）
  const plannedTimeOf=it=>{
    if(it.kind==="checkin")return timeMin((it.data.wStart)||"23:59");
    const t=it.data;
    return timeMin(t.planStart||"23:59");
  };
  const pendingItems=items.filter(i=>i.order!==0).sort((a,b)=>plannedTimeOf(a)-plannedTimeOf(b));

  // render done section
  if(doneItems.length)doneItems[doneItems.length-1].lastDone=true;
  if(pendingItems.length)pendingItems[pendingItems.length-1].lastPending=true;
  const safeAppend=(parent,it)=>{ try{ parent.appendChild(it.kind==="checkin"?makeRoutineItem(it):makeTaskCard(it)); }catch(e){ console.error("render item failed",e); } };
  doneItems.forEach(it=>safeAppend(body,it));


  if(pendingItems.length){
    const div=document.createElement("div");div.className="tl-divider";div.textContent="未完成";body.appendChild(div);
    const pendingWrap=document.createElement("div");pendingWrap.id="pending-list";
    pendingItems.forEach(it=>safeAppend(pendingWrap,it));
    body.appendChild(pendingWrap);
  }

  if(!doneItems.length&&!pendingItems.length){
    body.innerHTML='<div class="empty">今天还没有安排，点击右下角 + 添加任务</div>';
  }
}

function parseKeyTime(s){
  const d=new Date(s);
  if(!isNaN(d))return d;
  const now=new Date();
  const[h,m]=String(s).split(":").map(Number);
  return new Date(now.getFullYear(),now.getMonth(),now.getDate(),h||0,m||0);
}
function timeMin(s){if(!s)return 9999;const[h,m]=s.split(":").map(Number);return h*60+(m||0);}

/* ---- timeline helpers ---- */
function hhmm(iso){ if(!iso)return "--"; const d=new Date(iso); if(isNaN(d))return "--"; return pad(d.getHours())+":"+pad(d.getMinutes()); }
function hhmmNow(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function taskDateRangeText(t){
  if(t.repeat==="daily") return "每日任务";
  if(t.date===t.endDate){
    return (t.date===dateKey(new Date()))?"当日任务":`${parseKey(t.date).getMonth()+1}月${parseKey(t.date).getDate()}日任务`;
  }
  const a=parseKey(t.date), b=parseKey(t.endDate);
  if(a.getMonth()===b.getMonth()) return `${a.getDate()}号到${b.getDate()}号`;
  return `${a.getMonth()+1}月${a.getDate()}号到${b.getMonth()+1}月${b.getDate()}号`;
}
function taskPlannedText(t){
  const isPoint=(t.type==="point"||t.type==="single");
  return isPoint?`${t.planStart||"--"}`:`${t.planStart||"--"}-${t.planEnd||"--"}`;
}
function fmtDur(ms){
  const m=Math.max(0,Math.round((ms||0)/60000));
  if(m<60) return m+"分钟";
  const h=Math.floor(m/60), mm=m%60;
  return mm? (h+"小时"+mm+"分") : (h+"小时");
}
/* 卡片右下角文案：任务完成（移到上方时间轴）后显示「进行 X时Y分」（已扣暂停）；未完成显示预计时间 */
function currentWorkMs(t){
  let ms=t.workMs||0;
  if(t.type==="period"&&t.phase==="started"&&t.runStart!=null){ ms+=Date.now()-t.runStart; }
  return ms;
}
function taskMetaRight(it){
  const isPeriod=(it.type==="period");
  const done=isPeriod ? (it.phase==="done") : (it.done>=1 || it.done===true);
  if(isPeriod && (it.phase==="started"||it.phase==="paused"||it.phase==="done")){
    return `<span class="tm-dur" data-tid="${it.id}">进行 ${fmtDur(currentWorkMs(it))}</span>`;
  }
  if(done) return "进行 "+fmtDur(it.workMs||0);
  const isPoint=(it.type==="point"||it.type==="single");
  return isPoint?`${it.planStart||"--"}`:`${it.planStart||"--"}-${it.planEnd||"--"}`;
}
function taskAxisHTML(t,lastDone,lastPending){
  const done=isTaskDone(t);
  if(done){
    const ax=`<div class="tl-axis${done&&!lastDone?" bridge":""}">`;
    if(t.type==="period"){
      return ax+`<div class="tl-rail"></div>`+
        `<div class="tl-t done top">${t.startedAt||"--"}</div><div class="tl-dot top"></div>`+
        `<div class="tl-t done bottom">${t.endedAt||"--"}</div><div class="tl-dot bottom"></div></div>`;
    }
    return ax+`<div class="tl-rail"></div><div class="tl-t done mid">${hhmm(t.completedAt)}</div><div class="tl-dot mid"></div></div>`;
  }
  const isPoint=(t.type==="point"||t.type==="single");
  const started=(t.type==="period"&&(t.phase==="started"||t.phase==="paused")&&t.startedAt);
  const label=isPoint?(t.planStart||"--"):`${t.planStart||"--"}~${t.planEnd||"--"}`;
  const bridge=lastPending?"":" bridge";
  if(!isPoint){
    const topLabel=started?t.startedAt:(t.planStart||"--");
    return `<div class="tl-axis${bridge}"><div class="tl-rail light"></div>`+
      `<div class="tl-t plan top">${topLabel}</div><div class="tl-dot light top"></div>`+
      `<div class="tl-t plan bottom">${t.planEnd||"--"}</div><div class="tl-dot light bottom"></div></div>`;
  }
  return `<div class="tl-axis${bridge}"><div class="tl-rail light"></div><div class="tl-t plan mid">${label}</div><div class="tl-dot light mid"></div></div>`;
}
function taskActionHTML(t){
  if(t.type==="period"){
    if(t.phase==="done") return `<div class="tl-check checked" data-action="none"></div>`;
    if(t.phase==="started") return `<button type="button" class="tl-btn pause" data-action="pause">暂停</button><button type="button" class="tl-btn end" data-action="end">结束</button>`;
    if(t.phase==="paused") return `<button type="button" class="tl-btn resume" data-action="resume">继续</button><button type="button" class="tl-btn end" data-action="end">结束</button>`;
    return `<button type="button" class="tl-btn start" data-action="start">开始</button>`;
  }
  return `<div class="tl-check ${isTaskDone(t)?"checked":""}" data-action="toggle"></div>`;
}
function bindTaskAction(slot,t){
  slot.querySelectorAll("[data-action]").forEach(a=>{
    const act=a.dataset.action;
    if(act==="toggle") a.addEventListener("click",e=>{e.stopPropagation();toggleTaskDone(t.id,a);});

    else if(act==="pause") a.addEventListener("click",e=>{e.stopPropagation();pausePeriodTask(t.id);});
    else if(act==="resume") a.addEventListener("click",e=>{e.stopPropagation();resumePeriodTask(t.id);});
    else if(act==="end") a.addEventListener("click",e=>{e.stopPropagation();endPeriodTask(t.id);});
  });
}

function pausePeriodTask(id){

function resumePeriodTask(id){

function bindLongPressDrag(el,t){
  if(!el||!el.parentElement)return;
  let timer=null, startX=0, startY=0, dragging=false, clone=null, placeholder=null, list=null, startIndex=-1, initialTop=0, initialLeft=0, itemHeight=0;
  el.addEventListener("touchstart",e=>{
    if(isTaskDone(t))return;
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;dragging=false;
    timer=setTimeout(()=>{
      dragging=true;
      const rect=el.getBoundingClientRect();
      initialTop=rect.top;initialLeft=rect.left;itemHeight=rect.height+14;
      list=el.parentElement;startIndex=Array.from(list.children).indexOf(el);
      placeholder=document.createElement("div");placeholder.className="";placeholder.style.opacity="0.35";placeholder.style.height=rect.height+"px";placeholder.style.marginBottom="14px";
      clone=el.cloneNode(true);clone.style.position="fixed";clone.style.left=rect.left+"px";clone.style.top=rect.top+"px";clone.style.width=rect.width+"px";clone.style.zIndex="100";clone.style.opacity="0.95";clone.style.boxShadow="0 12px 30px rgba(0,0,0,0.15)";
      el.style.visibility="hidden";
      list.insertBefore(placeholder,el.nextSibling);
      document.body.appendChild(clone);
      if(window.navigator&&navigator.vibrate)navigator.vibrate(20);
    },400);
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(!dragging||!clone)return;
    e.preventDefault();
    const y=e.touches[0].clientY;
    clone.style.top=(initialTop+(y-startY))+"px";
    const children=Array.from(list.children).filter(c=>c!==el&&c!==placeholder);
    if(!children.length)return;
    let newIndex=children.length;
    for(let i=0;i<children.length;i++){
      const r=children[i].getBoundingClientRect();
      const mid=r.top+r.height/2;
      if(y<mid){newIndex=i;break;}
    }
    if(newIndex!==Array.from(list.children).indexOf(placeholder)){
      const ref=list.children[newIndex];
      if(ref&&ref!==placeholder)list.insertBefore(placeholder,ref);
      else list.appendChild(placeholder);
    }
  },{passive:false});
  el.addEventListener("touchend",e=>{
    clearTimeout(timer);timer=null;
    if(!dragging||!clone){dragging=false;return;}
    const finalIndex=Array.from(list.children).indexOf(placeholder);
    if(finalIndex!==-1&&finalIndex!==startIndex){
      const k=dateKey(selDate);
      const dayTasks=state.tasks.filter(x=>taskOnDay(x,k));
      const pending=dayTasks.filter(x=>!isTaskDone(x)).sort((a,b)=>a.order-b.order);
      const children=Array.from(list.children).filter(c=>c!==el&&c!==placeholder);
      const taskChildren=children.filter(c=>pending.find(x=>x.id===c.dataset.id));
      taskChildren.forEach((c,i)=>{const found=pending.find(x=>x.id===c.dataset.id);if(found)found.order=i;});
      saveState();
    }
    el.style.visibility="";
    if(clone)clone.remove();
    if(placeholder)placeholder.remove();
    clone=null;placeholder=null;dragging=false;
    renderCalendar();
  });
}
function isTaskDone(t){
  if(t.type==="period")return t.phase==="done";
  return t.done>=1;
}

/* confetti */
function confettiAt(x,y,count){
  const n=count||16;
  const colors=["#B08DF7","#9B72EF","#86EFAC","#FCD34D","#FDA4AF","#FFF6A4"];
  for(let i=0;i<n;i++){
    const el=document.createElement("div");el.className="confetti";
    el.style.left=x+"px";el.style.top=y+"px";
    const s=(4+Math.random()*5);el.style.width=s+"px";el.style.height=s+"px";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius="50%";el.style.opacity="1";
    const angle=Math.random()*Math.PI*2,dist=28+Math.random()*46;
    const dx=Math.cos(angle)*dist,dy=Math.sin(angle)*dist-36;
    el.style.transition="transform 0.7s ease-out, opacity 0.7s ease-out";
    document.body.appendChild(el);
    requestAnimationFrame(()=>{el.style.transform="translate("+dx+"px,"+dy+"px) scale(0)";el.style.opacity="0";setTimeout(()=>el.remove(),700);});
  }
}
function confettiAtEl(el,count){
  if(!el||!el.getBoundingClientRect)return;
  const r=el.getBoundingClientRect();
  confettiAt(r.left+r.width/2,r.top+r.height/2,count||14);
}

/* keep modal above the soft keyboard so 保存 stays tappable on mobile */
(function(){
  function fitModal(){
    if(!window.visualViewport)return;
    const vv=window.visualViewport;
    const vh=window.innerHeight||document.documentElement.clientHeight;
    const top=Math.max(0,Math.round(vv.offsetTop||0));
    const kb=Math.max(0,Math.round(vh-(top+vv.height)));
    const root=document.documentElement.style;
    root.setProperty("--modal-max-h", Math.round(vv.height)+"px");
    root.setProperty("--modal-top", top+"px");
    root.setProperty("--modal-kb", kb+"px");
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",fitModal);
    window.visualViewport.addEventListener("scroll",fitModal);
    // some browsers open the keyboard without firing resize immediately; refit shortly after focus
    document.addEventListener("focusin",()=>{ setTimeout(fitModal,150); });
    fitModal();
  }
})();

/* 近一周每日完成任务总时长折线图（可左右翻看前后周）；口径与日历页「已完成任务合计」一致：已完成的时间段任务 workMs 之和 */
let trendOffset=0; /* 0=含今天的最近一周；负数=更早的周；next 按钮在 >=0 时禁用（不显示未来） */
function trendHTML(offset){
  const mon=trendMonday(offset);
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(d.getDate()+i); days.push(dateKey(d)); }
  const labels=days.map(d=>{const dt=new Date(d+"T00:00:00");return (dt.getMonth()+1)+"/"+dt.getDate();});
  const vals=days.map(d=>state.tasks.filter(t=>taskOnDay(t,d)&&isTaskDone(t)&&t.type==="period"&&(t.workMs||0)>0).reduce((s,t)=>s+(t.workMs||0),0));
  const max=Math.max.apply(null,vals.concat([1]));
  const W=420,H=104,padX=40,padTop=30,plotH=44,baseY=padTop+plotH;
  const stepX=days.length>1?(W-2*padX)/(days.length-1):0;
  const xs=days.map((_,i)=>padX+i*stepX);
  const yOf=v=>baseY-(max>0?(v/max)*plotH:0);
  const ptStr=vals.map((v,i)=>`${xs[i].toFixed(1)},${yOf(v).toFixed(1)}`).join(" ");
  let dots="",valLabels="",dateLabels="";
  for(let i=0;i<days.length;i++){
    const x=xs[i],y=yOf(vals[i]);
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#A878F0" stroke="#fff" stroke-width="2"/>`;
    const vy=Math.max(y-9,12);
    valLabels+=`<text x="${x.toFixed(1)}" y="${vy.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#7C3AED">${fmtDur(vals[i])}</text>`;
    dateLabels+=`<text x="${x.toFixed(1)}" y="${(baseY+16).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA0AC">${labels[i]}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">
    <line x1="${padX}" y1="${baseY}" x2="${(W-padX).toFixed(1)}" y2="${baseY}" stroke="#EDE6FF" stroke-width="2"/>
    <polyline points="${ptStr}" fill="none" stroke="#A878F0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${valLabels}${dateLabels}
  </svg>`;
}
function trendMonday(offset){
  const now=new Date();
  const dow=now.getDay(); /* 0=Sun,1=Mon..6=Sat */
  const back=(dow+6)%7; /* 距本周一的天数 */
  const mon=new Date(now); mon.setDate(mon.getDate()-back + 7*offset);
  return mon;
}
function trendRangeText(offset){
  const mon=trendMonday(offset);
  const a=new Date(mon), b=new Date(mon); b.setDate(b.getDate()+6);
  const f=x=>(x.getMonth()+1)+"/"+x.getDate();
  return f(a)+" – "+f(b);
}

function taskPieHTML(){
  const tk=todayKey();
  const tasks=state.tasks.filter(t=>(t.workMs||0)>0 && t.lastWorkDate===tk && t.phase!=="started").sort((a,b)=>(b.workMs||0)-(a.workMs||0));
  const total=tasks.reduce((s,t)=>s+(t.workMs||0),0);
  const PALETTE=["#B79CED","#8FB8F0","#8FD9B6","#F5D77A","#F2A06A","#EFA0C2","#84D2CC","#EE9B9B"];
  const colOf=i=>PALETTE[i%PALETTE.length];
  const trunc=(s,n)=>{s=s||"";return s.length>n?s.slice(0,n)+"…":s;};
  if(total<=0){
    return `<div class="st-pie-empty">暂无计时数据<span>完成时间段任务并点击「结束」后，这里会显示各任务耗时占比</span></div>`;
  }
  const CX=160, CY=100, R=66, NAME_R=R*0.55;
  const LEAD_IN=R+10, LEAD_OUT=R+26;
  if(tasks.length===1){
    const t=tasks[0], col=colOf(0);
    return `<div class="st-pie-wrap"><svg viewBox="0 0 320 200" width="100%" style="max-width:360px;display:block;margin:0 auto;">`
      +`<circle cx="${CX}" cy="${CY}" r="${R}" fill="${col}" stroke="#fff" stroke-width="2"/>`
      +`<text x="${CX}" y="${CY-3}" text-anchor="middle" font-size="12" font-weight="800" fill="#4A4063">${esc(trunc(t.name,6))}</text>`
      +`<line x1="${CX+R}" y1="${CY}" x2="${CX+LEAD_OUT}" y2="${CY}" stroke="${col}" stroke-width="1.5"/>`
      +`<text x="${CX+LEAD_OUT+3}" y="${CY+3}" text-anchor="start" font-size="11" font-weight="700" fill="#5A5270">${fmtDur(t.workMs||0)}</text></svg></div>`;
  }
  let a0=-Math.PI/2, paths="", innerText="", leaderLines="", leaderText="";
  const leaders=[];
  tasks.forEach((t,i)=>{
    const val=t.workMs||0, frac=val/total;
    const a1=a0+frac*Math.PI*2;
    const large=(a1-a0)>Math.PI?1:0;
    const x0=CX+R*Math.cos(a0), y0=CY+R*Math.sin(a0);
    const x1=CX+R*Math.cos(a1), y1=CY+R*Math.sin(a1);
    const col=colOf(i);
    paths+=`<path d="M${CX} ${CY} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    const am=(a0+a1)/2;
    const lx=CX+NAME_R*Math.cos(am), ly=CY+NAME_R*Math.sin(am);
    innerText+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="#4A4063">${esc(trunc(t.name,4))}</text>`;
    leaders.push({am, val, col});
    a0=a1;
  });
  const place=(arr, dir)=>{
    arr.sort((p,q)=>Math.sin(p.am)-Math.sin(q.am));
    let prevY=null;
    arr.forEach(p=>{
      const c=Math.cos(p.am), s=Math.sin(p.am);
      let ty=CY+LEAD_IN*s;
      if(prevY!==null && ty < prevY+16) ty=prevY+16;
      prevY=ty;
      const p0x=CX+R*c, p0y=CY+R*s;
      const p1x=CX+LEAD_IN*c, p1y=CY+LEAD_IN*s;
      const p2x=CX+LEAD_OUT*c;
      leaderLines+=`<polyline points="${p0x.toFixed(1)},${p0y.toFixed(1)} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${ty.toFixed(1)}" fill="none" stroke="${p.col}" stroke-width="1.4" opacity="0.9"/>`;
      const tx=p2x+dir*3;
      leaderText+=`<text x="${tx.toFixed(1)}" y="${(ty+3).toFixed(1)}" text-anchor="${dir>0?'start':'end'}" font-size="10.5" font-weight="700" fill="#5A5270">${fmtDur(p.val)}</text>`;
    });
  };
  place(leaders.filter(p=>Math.cos(p.am)>=0), 1);
  place(leaders.filter(p=>Math.cos(p.am)<0), -1);
  return `<div class="st-pie-wrap"><svg viewBox="0 0 320 200" width="100%" style="max-width:360px;display:block;margin:0 auto;">${paths}${innerText}${leaderLines}${leaderText}</svg></div>`;
}

function buildDayTimeline(k){
  const items=[];
  const tls=state.checkins.filter(c=>c.showInTimeline && checkinOnDay(c,k)).sort((a,b)=>{ if(a.isDefault&&!b.isDefault)return -1; if(!a.isDefault&&b.isDefault)return 1; return a.order-b.order; });
  tls.forEach(c=>{
    const recs=c.records[k]||[];
    const base={kind:"checkin",done:false,name:c.name,color:c.color||"yellow",wStart:c.wStart||"",wEnd:c.wEnd||"",repeat:c.repeat,start:c.start,end:c.end};
    if(recs.length){ recs.forEach(r=>items.push(Object.assign({},base,{done:true,time:r.time||"",mood:r.mood||"",emoji:MOODS[r.mood]||"",note:r.note||""}))); }
    else items.push(base);
  });
  const dayTasks=state.tasks.filter(t=>taskOnDay(t,k)).sort((a,b)=>a.order-b.order);
  dayTasks.forEach(t=>{
    const done=isTaskDone(t);
    items.push({kind:"task",done,name:t.name,color:t.color||"yellow",type:t.type,repeat:t.repeat,planStart:t.planStart||"",planEnd:t.planEnd||"",startedAt:t.startedAt||"",endedAt:t.endedAt||"",desc:t.desc||"",date:t.date,endDate:t.endDate,completedAt:t.completedAt,phase:t.phase,workMs:t.workMs||0});
  });
  return items;
}

function connectMQTT(){
  setConn("busy","连接中…");
  if(typeof mqtt==="undefined"){ setConn("off","未连接"); return; }
  try{ if(mqttClient){ mqttClient.end(true); } }catch(e){}
  let client;
  try{
    client=mqtt.connect(MQTT_URL,{clientId:"wb_"+uid(),clean:true,reconnectPeriod:3000,connectTimeout:8000});
  }catch(e){ setConn("off","未连接"); return; }
  mqttClient=client;
  client.on("connect",()=>{
    mqttReady=true; setConn("on","已连接");
    const topic="workbench/"+profile.roomCode+"/+";
    try{ client.subscribe(topic,{qos:1},()=>{}); }catch(e){}
    publishMyState();
  });
  client.on("message",(topic,msg)=>{
    try{
      const d=JSON.parse(msg.toString());
      if(!d||!d.userId||d.userId===profile.userId)return;
      friendsCache[d.userId]=d; saveFriendsCache();
      if(route==="stats"){ const w=document.getElementById("friends-wrap"); if(w){ w.innerHTML=friendsHTML(); bindFriendClicks(); } }
      refreshOpenFriend();
    }catch(e){}
  });
  client.on("error",()=>{ mqttReady=false; setConn("off","未连接"); });
  client.on("close",()=>{ mqttReady=false; setConn("off","未连接"); });
  client.on("reconnect",()=>{ setConn("busy","连接中…"); });
}
function setConn(cls,text){
  const el=document.getElementById("me-conn-state"), t=document.getElementById("me-conn-text");
  if(el) el.className="conn-state "+cls;
  if(t) t.textContent=text;
}
function openFriendDetail(uid){
  const f=friendsCache[uid]; if(!f)return;
  currentFriendUid=uid;
  const av=f.avatar?`<img src="${f.avatar}" alt="">`:`👤`;
  const fdItems=f.timeline||[];
  const fdTotal=fdItems.filter(it=>it.kind==="task"&&it.type==="period"&&it.phase==="done"&&(it.workMs||0)>0).reduce((s,it)=>s+(it.workMs||0),0);
  const body=document.getElementById("fd-body");
  body.innerHTML=`<div class="fd-head"><div class="friend-ava">${av}</div><div><div class="fd-name">${esc(f.nickname||"好友")}</div>${f.signature?`<div class="fd-sign">${esc(f.signature)}</div>`:""}</div></div><div class="fd-sub"><span>${esc(f.nickname||"好友")} 今天的动态</span><span class="fd-dur">${fmtDur(fdTotal)}</span></div><div id="fd-timeline" style="padding:0 4px"></div>`;
  renderFriendTimeline(document.getElementById("fd-timeline"), f.timeline||[]);
  openModal("modal-friend");
}
function renderFriendTimeline(container,items){
  container.innerHTML="";
  if(!items||!items.length){ container.innerHTML='<div class="empty">对方今天还没有安排</div>'; return; }
  const doneTimeOf=it=>{ if(it.kind==="checkin")return it.time||"23:59"; if(it.type==="period")return it.endedAt||hhmm(it.completedAt); return hhmm(it.completedAt); };
  const plannedTimeOf=it=>{ if(it.kind==="checkin")return timeMin(it.wStart||"23:59"); return timeMin(it.planStart||"23:59"); };
  const doneItems=items.filter(i=>i.done).sort((a,b)=>timeMin(doneTimeOf(a))-timeMin(doneTimeOf(b)));
  const pendingItems=items.filter(i=>!i.done).sort((a,b)=>plannedTimeOf(a)-plannedTimeOf(b));
  const friendAxis=(it,bridge)=>{
    const trimH=t=>(t||"").replace(/^0/,"");
    const cls=bridge?" bridge":"";
    if(it.kind==="checkin"){
      if(it.done) return `<div class="tl-axis${cls}"><div class="tl-rail"></div><div class="tl-t done mid">${it.time||"--"}</div><div class="tl-dot mid"></div></div>`;
      if(it.wStart && it.wEnd) return `<div class="tl-axis${cls}"><div class="tl-rail light"></div><div class="tl-t plan top">${trimH(it.wStart)}</div><div class="tl-dot light top"></div><div class="tl-t plan bottom">${trimH(it.wEnd)}</div><div class="tl-dot light bottom"></div></div>`;
      const s=it.wStart||it.wEnd||"--";
      return `<div class="tl-axis${cls}"><div class="tl-rail light"></div><div class="tl-t plan mid">${trimH(s)}</div><div class="tl-dot light mid"></div></div>`;
    }
    const isPoint=(it.type==="point"||it.type==="single");
    if(it.done){
      if(!isPoint && it.startedAt && it.endedAt) return `<div class="tl-axis${cls}"><div class="tl-rail"></div><div class="tl-t done top">${it.startedAt}</div><div class="tl-dot top"></div><div class="tl-t done bottom">${it.endedAt}</div><div class="tl-dot bottom"></div></div>`;
      return `<div class="tl-axis${cls}"><div class="tl-rail"></div><div class="tl-t done mid">${hhmm(it.completedAt)}</div><div class="tl-dot mid"></div></div>`;
    }
    if(!isPoint && it.planStart && it.planEnd) return `<div class="tl-axis${cls}"><div class="tl-rail light"></div><div class="tl-t plan top">${it.planStart}</div><div class="tl-dot light top"></div><div class="tl-t plan bottom">${it.planEnd}</div><div class="tl-dot light bottom"></div></div>`;
    const s=it.planStart||"--";
    return `<div class="tl-axis${cls}"><div class="tl-rail light"></div><div class="tl-t plan mid">${s}</div><div class="tl-dot light mid"></div></div>`;
  };
  const make=(it,bridge)=>{
    const div=document.createElement("div"); div.className="tl-item";
    const axis=friendAxis(it,bridge);
    let cardHTML;
    if(it.kind==="checkin"){
      const titleHTML=it.done&&it.emoji?`${esc(it.name)} <span class="tl-mood-inline"><span class="tl-mood-emoji">${it.emoji}</span>${esc(it.mood)}</span>`:esc(it.name);
      const noteBelow=it.done&&it.note?`<div class="tl-note">${esc(it.note)}</div>`:"";
      const leftTxt=checkinDateText(it);
      const wHint=windowHint(it);
      const metaR=wHint?`<span class="tl-meta-l2">${wHint}</span>`:(it.done?`<span class="tl-meta-l2">打卡 ${it.time||""}</span>`:`<span class="tl-meta-l2">尚未打卡</span>`);
      cardHTML=`<div class="tl-card ${it.done?"done":""}"><div class="tl-body"><div class="tl-text"><div class="tl-title">${titleHTML}</div></div><div class="tl-check ${it.done?"checked":""}"></div></div><div class="tl-meta-inline"><span class="tl-meta-l1">${leftTxt}</span>${metaR}</div>${noteBelow}</div>`;
    }else{
      cardHTML=`<div class="tl-card ${it.done?"done":""}"><div class="tl-body"><div class="tl-name">${esc(it.name)}</div><div class="tl-check ${it.done?"checked":""}"></div></div><div class="tl-meta-inline"><span class="tl-meta-l1">${taskDateRangeText(it)}</span><span class="tl-meta-l2">${taskMetaRight(it)}</span></div></div>`;
    }
    div.innerHTML=axis+cardHTML;
    const card=div.querySelector(".tl-card"); if(card)applyCardColor(card,it.color);
    return div;
  };
  doneItems.forEach((it,i)=>container.appendChild(make(it, i<doneItems.length-1)));
  if(pendingItems.length){
    const d=document.createElement("div"); d.className="tl-divider"; d.textContent="未完成"; container.appendChild(d);
    pendingItems.forEach((it,i)=>container.appendChild(make(it, i<pendingItems.length-1)));
  }
}

/* 好友动态弹窗：往上拖动把手可展开，松手吸附；默认高度下方内容可滚动 */
(function(){
  const modal=document.getElementById("modal-friend");
  if(!modal)return;
  const card=modal.querySelector(".modal-card");
  const grip=document.getElementById("fd-grip");
  if(!card||!grip)return;
  let dragging=false, startY=0, baseMax=0;
  const vh=()=>window.innerHeight/100;
  grip.addEventListener("pointerdown",e=>{
    dragging=true; startY=e.clientY;
    baseMax=parseFloat(getComputedStyle(card).maxHeight)||(window.innerHeight*0.92);
    card.style.transition="none";
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
  });
  grip.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dy=startY-e.clientY;            // 往上拖 → 正数 → 展开
    let nh=baseMax+dy;
    const minH=window.innerHeight*0.55, maxH=window.innerHeight*0.98;
    nh=Math.max(minH,Math.min(maxH,nh));
    card.style.maxHeight=nh+"px";
  });
  const end=()=>{ if(!dragging)return; dragging=false; card.style.transition=""; };
  grip.addEventListener("pointerup",end);
  grip.addEventListener("pointercancel",end);
  /* 每次打开重置为默认高度（92dvh），可重新拖拽展开 */
  const _open=openModal;
  openModal=function(id){ _open(id); if(id==="modal-friend") card.style.maxHeight=""; };
})();

/* 保存即同步（不改任何原有逻辑，仅补充发布） */
(function(){ const orig=saveState; saveState=function(){ orig(); debouncePublish(); }; })();

/* 心跳：保持好友视图新鲜 */
setInterval(()=>{ if(mqttReady) publishMyState(); }, 20000);

/* 进行中/暂停/已完成任务的右下角计时实时刷新（每秒） */
setInterval(()=>{
  document.querySelectorAll(".tm-dur[data-tid]").forEach(el=>{
    if(el.closest("#modal-friend")) return; /* 好友弹窗内为同步快照，不实时跳秒 */
    const t=state.tasks.find(x=>x.id===el.dataset.tid);
    if(t&&t.type==="period"&&(t.phase==="started"||t.phase==="paused"||t.phase==="done")){
      el.textContent="进行 "+fmtDur(currentWorkMs(t));
    }
  });
},1000);

function initFriends(){ connectMQTT(); }

/* 自动刷新好友列表：每 30 秒重新订阅并拉取，无需手动点击 */
setInterval(refreshFriends, 30000);

/* 时间输入框的「✕」清除按钮：一键取消已设的开始/结束时间 */
document.querySelectorAll(".time-clear").forEach(b=>b.addEventListener("click",()=>{ const el=document.getElementById(b.dataset.clear); if(el)el.value=""; }));

/* startup */
switchRoute("countdown");
initFriends();
</script>
